name: Deploy to HuggingFace Spaces

on:
  push:
    branches: [master]
    paths-ignore:
      - 'README.md'
      - '.github/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Push to HuggingFace Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git clone https://evgeniimatveevusa:$HF_TOKEN@huggingface.co/spaces/evgeniimatveevusa/interview-coach hf_space

          rsync -av --exclude='.git' --exclude='.github/' --exclude='.venv/' \
            --exclude='data/' --exclude='__pycache__/' --exclude='.env' \
            --exclude='hf_space/' --exclude='README.md' \
            . hf_space/

          {
            echo '---'
            echo 'title: Data Interview Coach'
            echo 'emoji: 🎓'
            echo 'colorFrom: green'
            echo 'colorTo: blue'
            echo 'sdk: docker'
            echo 'app_port: 8501'
            echo 'pinned: false'
            echo '---'
          } > hf_space/README.md

          cd hf_space
          git add -A
          git diff --staged --quiet || git commit -m "deploy: sync from GitHub $COMMIT_SHA"
          git push
